<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | CyberLab</title>
  <!-- Тот самый CSS, который ты привёл -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
    }

    body {
      background: #0b1220;
      color: #e5e7eb;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    /* HEADER */
    .header {
      background: rgba(10, 18, 40, 0.9);
      backdrop-filter: blur(10px);
    }

    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .logo span {
      color: #60a5fa;
    }

    header nav {
      display: flex;
      flex-wrap: wrap;
      margin-left: 20px;
      gap: 7px;
      justify-content: end;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #cbd5f5;
    }

    nav a:hover {
      color: #cbd5f58b
    }

    /* FOOTER */
    .footer {
      padding: 30px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    @media (max-width: 500px) {
      .header nav {
        flex-direction: column;
      }
    }

    /* ----- СТИЛИ СТРАНИЦЫ ЛОГИНА (в стилистике сайта) ----- */
    .login-section {
      min-height: calc(100vh - 160px); /* чтобы футер не убегал */
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.9)),
        url("../img/hero.webp") center/cover no-repeat;
      background-color: #0b1220; /* fallback */
    }

    .login-card {
      background: #111827;
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid #1f2937;
      backdrop-filter: blur(12px);
      background: rgba(17, 24, 39, 0.85);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .login-card:hover {
      border-color: #3b82f6;
      transform: translateY(-6px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-header h2 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
      color: white;
    }

    .login-header p {
      color: #9ca3af;
      font-size: 14px;
    }

    .login-header span {
      color: #60a5fa;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5f5;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 12px;
      font-size: 16px;
      color: #e5e7eb;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .input-group input::placeholder {
      color: #4b5563;
      font-size: 14px;
    }

    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
    }

    .remember input {
      accent-color: #3b82f6;
      width: 16px;
      height: 16px;
    }

    .forgot-link {
      color: #60a5fa;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #93c5fd;
    }

    .login-btn {
      width: 100%;
      padding: 14px 28px;
      background: #3b82f6;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
      margin-bottom: 24px;
    }

    .login-btn:hover {
      background: #2563eb;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .login-btn:active {
      transform: scale(0.98);
    }

    .register-redirect {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    .register-redirect a {
      color: #60a5fa;
      font-weight: 600;
      margin-left: 6px;
    }

    .register-redirect a:hover {
      text-decoration: underline;
    }

    /* разделитель */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      color: #4b5563;
      margin: 24px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      border-bottom: 1px solid #1f2937;
    }

    .divider span {
      margin: 0 12px;
      font-size: 13px;
      text-transform: uppercase;
    }

    /* соцсети (доп фишка под стиль) */
    .social-login {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icon {
      background: #1e293b;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5f5;
      font-size: 20px;
      font-weight: bold;
      border: 1px solid #2d3a52;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .social-icon:hover {
      background: #2d3a52;
      color: white;
      border-color: #3b82f6;
      transform: translateY(-3px);
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Cyber<span>Lab</span></a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="#">Новости</a>
        <a href="#">Темы</a>
        <a href="#">Инструменты</a>
        <a href="login.html" style="color:#60a5fa; font-weight:500;">Вход</a>
      </nav>
    </div>
  </header>

  <section class="login-section">
    <div class="login-card">
      <div class="login-header">
        <h2>Вход в <span>CyberLab</span></h2>
        <p>Добро пожаловать обратно</p>
      </div>

      <form>
        <div class="input-group">
          <label>Email или логин</label>
          <input type="text" placeholder="alex@cyberlab.ru" autocomplete="email" id="email">
        </div>

        <div class="input-group" >
          <label>Пароль</label>
          <input type="password" placeholder="••••••••" autocomplete="current-password" id="pass">
        </div>

        <div class="login-options">
          <a href="#" class="forgot-link">Забыли пароль?</a>
        </div>

        <button type="button" class="login-btn" id="loginButton">Войти</button>

        <div class="register-redirect">
          Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
        </div>

      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      © 2025 CyberLab. Все права защищены. Конфиденциальность и условия.
    </div>
  </footer>
</body>
<script src="login.js"></script>
</html>
