<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | CyberLab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, Arial, sans-serif;
    }

    a {
      text-decoration: none;
      color: white;
    }

    body {
      background: #0b1220;
      color: #e5e7eb;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
    }

    /* HEADER */
    .header {
      background: rgba(10, 18, 40, 0.9);
      backdrop-filter: blur(10px);
    }

    .header .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
    }

    .logo span {
      color: #60a5fa;
    }

    header nav {
      display: flex;
      flex-wrap: wrap;
      margin-left: 20px;
      gap: 7px;
      justify-content: end;
    }

    nav a {
      margin-left: 20px;
      text-decoration: none;
      color: #cbd5f5;
    }

    nav a:hover {
      color: #cbd5f58b
    }

    /* FOOTER */
    .footer {
      padding: 30px;
      text-align: center;
      font-size: 14px;
      color: #64748b;
    }

    @media (max-width: 500px) {
      .header nav {
        flex-direction: column;
      }
    }

    /* ----- СТРАНИЦА РЕГИСТРАЦИИ ----- */
    .register-section {
      min-height: calc(100vh - 160px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      background: radial-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.9)),
        url("../img/hero.webp") center/cover no-repeat;
      background-color: #0b1220;
    }

    .register-card {
      background: #111827;
      width: 100%;
      max-width: 480px;
      padding: 40px 32px;
      border-radius: 24px;
      border: 1px solid #1f2937;
      backdrop-filter: blur(12px);
      background: rgba(17, 24, 39, 0.85);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .register-card:hover {
      border-color: #3b82f6;
      transform: translateY(-6px);
    }

    .register-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .register-header h2 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 8px;
      color: white;
    }

    .register-header p {
      color: #9ca3af;
      font-size: 14px;
    }

    .register-header span {
      color: #60a5fa;
    }

    /* Два поля в ряд (имя + фамилия) */
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #cbd5f5;
      font-weight: 500;
    }

    .input-group input {
      width: 100%;
      padding: 14px 18px;
      background: #0b1220;
      border: 1px solid #1f2937;
      border-radius: 12px;
      font-size: 16px;
      color: #e5e7eb;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }

    .input-group input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
    }

    .input-group input::placeholder {
      color: #4b5563;
      font-size: 14px;
    }

    /* Индикатор сложности пароля */
    .password-strength {
      margin-top: 8px;
      height: 4px;
      background: #1f2937;
      border-radius: 4px;
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      background: #ef4444;
      border-radius: 4px;
      transition: width 0.3s, background 0.3s;
    }

    .strength-text {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 12px;
      color: #6b7280;
    }

    /* Чекбокс согласия */
    .terms-group {
      margin-bottom: 28px;
    }

    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .terms-check input {
      margin-top: 2px;
      accent-color: #3b82f6;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .terms-check label {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.5;
      cursor: pointer;
    }

    .terms-check a {
      color: #60a5fa;
      font-weight: 500;
    }

    .terms-check a:hover {
      text-decoration: underline;
    }

    .register-btn {
      width: 100%;
      padding: 14px 28px;
      background: #3b82f6;
      border: none;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 8px 16px rgba(59, 130, 246, 0.2);
      margin-bottom: 24px;
    }

    .register-btn:hover {
      background: #2563eb;
      box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    .login-redirect {
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    .login-redirect a {
      color: #60a5fa;
      font-weight: 600;
      margin-left: 6px;
    }

    .login-redirect a:hover {
      text-decoration: underline;
    }

    /* Ошибка валидации (для демо) */
    .input-error input {
      border-color: #ef4444 !important;
    }

    .error-message {
      color: #ef4444;
      font-size: 12px;
      margin-top: 6px;
      display: none;
    }

    .input-error .error-message {
      display: block;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Cyber<span>Lab</span></a>
      <nav>
        <a href="index.html">Главная</a>
        <a href="#">Новости</a>
        <a href="#">Темы</a>
        <a href="#">Инструменты</a>
        <a href="register.html" style="color:#60a5fa; font-weight:500;">Регистрация</a>
      </nav>
    </div>
  </header>

  <section class="register-section">
    <div class="register-card">
      <div class="register-header">
        <h2>Создать <span>аккаунт</span></h2>
        <p>Присоединяйся к сообществу CyberLab</p>
      </div>

      <form id="registerForm">
        <!-- Имя и Фамилия в одну строку -->
        <div class="input-row">
          <div class="input-group">
            <label>Имя</label>
            <input type="text" placeholder="Алексей" autocomplete="given-name" required id="username">
          </div>
        </div>

        <!-- Email -->
        <div class="input-group" id="emailGroup">
          <label>Email</label>
          <input type="email" placeholder="alex@cyberlab.ru" autocomplete="email" required id="email"> 
          <div class="error-message">Введите корректный email</div>
        </div>

        <!-- Пароль -->
        <div class="input-group" id="passwordGroup">
          <label>Пароль</label>
          <input type="password" id="pass" placeholder="••••••••" autocomplete="new-password" required>

        </div>

        <!-- Подтверждение пароля -->



        <button type="button" class="register-btn" id="registerBtn">Зарегистрироваться</button>

        <div class="login-redirect">
          Уже есть аккаунт? <a href="login.html">Войти</a>
        </div>
      </form>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      © 2025 CyberLab. Все права защищены. Конфиденциальность и условия.
    </div>
  </footer>

  <!-- Скрипт для индикатора сложности пароля и валидации -->
  <script src="register.js">
  </script>
</body>
</html>
