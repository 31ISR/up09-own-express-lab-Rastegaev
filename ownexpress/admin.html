<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель | News Portal</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Дополнительные стили для админки */
        .admin-panel {
            padding: 80px 0;
            min-height: 100vh;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .admin-header h1 {
            font-size: 36px;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            padding: 12px 24px;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid #ef4444;
            color: #ef4444;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        .admin-form {
            background: #111827;
            padding: 40px;
            border-radius: 20px;
            border: 1px solid #1f2937;
            max-width: 900px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #9ca3af;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 12px 16px;
            background: #1f2937;
            border: 2px solid #374151;
            border-radius: 10px;
            color: #e5e7eb;
            font-size: 15px;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #3b82f6;
            background: #111827;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .file-upload {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-upload input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .file-upload-label {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 30px;
            background: #1f2937;
            border: 2px dashed #374151;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #9ca3af;
        }

        .file-upload-label:hover {
            border-color: #3b82f6;
            background: #111827;
            color: #60a5fa;
        }

        .file-upload-label span {
            font-size: 32px;
        }

        .image-preview {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preview-item {
            position: relative;
            width: 150px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #374151;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-item .remove-preview {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            background: #ef4444;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .preview-item:hover .remove-preview {
            opacity: 1;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #374151;
        }

        .btn-primary {
            padding: 14px 32px;
            background: #3b82f6;
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
            flex: 1;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .btn-secondary {
            padding: 14px 32px;
            background: transparent;
            border: 2px solid #374151;
            color: #9ca3af;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: #4b5563;
            color: #e5e7eb;
        }

        .char-count {
            float: right;
            color: #6b7280;
            font-size: 12px;
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            
            .admin-form {
                padding: 24px;
            }
            
            .form-actions {
                flex-direction: column;
            }
        }

        /* Анимация успешной отправки */
        @keyframes successPulse {
            0%, 100% { border-color: #374151; }
            50% { border-color: #10b981; }
        }

        .form-success {
            animation: successPulse 1s ease;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">News<span>Portal</span></div>
            <nav>
                <a href="index.html">Главная</a>
                <a href="news.html">Новости</a>
                <a href="admin.html">Админка</a>
            </nav>
        </div>
    </header>

    <main class="admin-panel">
        <div class="container">
            <div class="admin-header">
                <h1>📝 Создание новости</h1>
                <button class="logout-btn" onclick="logout()">Выйти</button>
            </div>

            <form class="admin-form" id="newsForm">
                <!-- Название страницы (URL) -->
                <div class="form-group">
                    <label for="pageSlug">Название страницы (URL)</label>
                    <input type="text" name="slug" placeholder="naprimer: vazhnaya-novost-2024" required id="namestate">
                    
                </div>

                <!-- Заголовок -->
                <div class="form-group">
                    <label for="title">Заголовок новости</label>
                    <input type="text" id="title" name="title" placeholder="Введите заголовок" required maxlength="200" id="title">
                    <span class="char-count" id="titleCount">0/200</span>
                </div>

                <!-- Предисловие -->
                <div class="form-group">
                    <label for="excerpt">Предисловие (краткое описание)</label>
                    <textarea id="excerpt" name="excerpt" placeholder="Краткое описание новости для карточки..." rows="3" maxlength="300" id="excerpt"></textarea>
                    <span class="char-count" id="excerptCount">0/300</span>
                </div>

                <!-- Основной текст -->
                <div class="form-group">
                    <label for="content">Текст статьи</label>
                    <textarea id="content" name="content" placeholder="Полный текст новости..." rows="10" required id="content"></textarea>
                </div>

                <!-- Загрузка двух фото -->
                <div class="form-row">
                    <div class="form-group">
                        <label>Главное фото (обложка)</label>
                        <div class="file-upload">
                            <input type="file" id="mainImage" accept="image/*">
                            <div class="file-upload-label">
                                <span>🖼️</span>
                                <span>Выберите главное фото</span>
                            </div>
                        </div>
                        <div id="mainImagePreview" class="image-preview"></div>
                    </div>

                    <div class="form-group">
                        <label>Дополнительное фото</label>
                        <div class="file-upload">
                            <input type="file" id="secondaryImage" accept="image/*">
                            <div class="file-upload-label">
                                <span>📸</span>
                                <span>Выберите второе фото</span>
                            </div>
                        </div>
                        <div id="secondaryImagePreview" class="image-preview"></div>
                    </div>
                </div>

                <!-- Категория -->

                <!-- Кнопки действий -->
                <div class="form-actions">
                    <button type="button" class="btn-primary" id="buttonSubmit">Опубликовать новость</button>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2024 NewsPortal. Все права защищены.</p>
        </div>
    </footer>
